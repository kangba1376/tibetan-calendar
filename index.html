:root{
  --bg:#f7f1e6; --card:#fffdf8; --ink:#2b1d14; --sub:#7a6757;
  --red:#8c1c13; --red-2:#b03a2e; --gold:#c99a2e; --line:#e6dac6;
  --shadow:0 10px 30px rgba(90,60,30,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 50% -10%, #fff9ee 0%, transparent 60%),
    repeating-linear-gradient(45deg, rgba(201,154,46,.045) 0 8px, transparent 8px 16px),
    var(--bg);
  min-height:100vh;
  padding:28px 16px 56px;
}
.wrap{max-width:860px;margin:0 auto}
header{text-align:center;margin-bottom:22px}
h1{
  font-family:'WujinLabuleng','Microsoft Himalaya',serif;
  font-size:clamp(26px,5vw,40px);margin:0 0 8px;letter-spacing:1px;
  color:var(--red);font-weight:400;line-height:1.8;
}
.sub{color:var(--sub);font-size:14px;line-height:1.8}
.badge-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:22px;
}
.search{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.year-box{
  flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:10px;
  border:1.5px solid var(--line);border-radius:14px;padding:6px 8px;background:#fff;
}
.year-box:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,154,46,.13)}
.year-box input{
  border:0;outline:0;width:100%;min-width:0;font-size:28px;font-weight:700;text-align:center;
  color:var(--ink);background:transparent;font-variant-numeric:tabular-nums;
}
.step{
  width:42px;height:42px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--red);font-size:22px;line-height:1;cursor:pointer;
}
.step:hover{background:#fffaf0}
.step:active{background:#fff;color:var(--red);border-color:var(--red);box-shadow:none}
.btn{
  border:0;border-radius:14px;padding:0 22px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:'WujinLabuleng','Microsoft Himalaya',serif;
  background:linear-gradient(180deg,var(--red-2),var(--red));color:#fff;
  min-height:56px;box-shadow:0 6px 16px rgba(140,28,19,.22);
}
.btn.ghost{
  background:#1a3f7a;color:#fff;border:1.5px solid #1a3f7a;box-shadow:0 4px 12px rgba(26,63,122,.22);min-height:44px;padding:0 16px;font-size:14px;
}
.btn:active,.btn.ghost:active{
  background:#fff;color:var(--red);border:1.5px solid #e3d2b0;box-shadow:none;
}
.result{margin-top:20px;display:none}
.result.show{display:block;animation:up .28s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.year-line{
  display:flex;align-items:baseline;gap:10px;justify-content:center;flex-wrap:wrap;
  color:var(--sub);font-size:14px;
}
.year-line b{font-size:18px;color:var(--ink)}
.year-line .tibr{font-family:'WujinLabuleng','Microsoft Himalaya',serif;font-size:16px;line-height:1.8}
.tib-name{
  text-align:center;margin:10px 0 4px;line-height:1.7;
  font-family:'WujinLabuleng','Microsoft Himalaya',serif;
  font-size:clamp(40px,10vw,64px);color:var(--red);
}
.tib-sub{
  text-align:center;font-family:'WujinLabuleng','Microsoft Himalaya',serif;
  font-size:26px;line-height:1.7;color:#8a7050;margin-bottom:14px;min-height:44px;
}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
.chip{
  background:#fbf3df;border:1px solid #ecd9ac;border-radius:12px;
  padding:8px 16px;color:#6b532a;text-align:center;min-width:88px;
}
.chip .cv{font-family:'WujinLabuleng','Microsoft Himalaya',serif;font-size:22px;line-height:1.8}
.chip .cl{font-family:'WujinLabuleng','Microsoft Himalaya',serif;font-size:11px;color:#a08a63;margin-top:2px;line-height:1.6}
.today-line{margin-top:18px;text-align:center;font-family:'WujinLabuleng','Microsoft Himalaya',serif;font-size:15px;line-height:1.9;color:#8c1c13}
.foot{margin-top:26px;text-align:center;color:#9a866f;font-size:12px;line-height:1.8}
.foot .tibw{font-family:'WujinLabuleng','Microsoft Himalaya',serif;font-size:12px}
.foot .copyright{margin-top:8px;color:#c4b6a4;font-size:6px;letter-spacing:.4px}
.foot .copyright .tibw{font-size:8px}
@media (max-width:560px){
  .tib-name{font-size:44px}
  .card{padding:16px;border-radius:16px}
  .search{gap:8px}
  .btn{flex:1 1 auto}
  .chip{min-width:76px;padding:8px 10px}
}
body.embed{background:transparent;padding:4px}
body.embed header,body.embed .foot{display:none}
body.embed .card{box-shadow:0 2px 10px rgba(90,60,30,.08)}
</style>
